---   # rust-miniscript CI: If you edit this file please update README.md
on:   # yamllint disable-line rule:truthy
  push:
    branches:
      - master
      - 'test-ci/**'
  pull_request:

name: Continuous integration

# Avoids CI runner disk space logs fill up
env:
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  Stable:                       # 2 jobs, one per lock file.
    name: Test - stable toolchain
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dep: [minimal, recent]
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rbmt
      - name: "Run tests"
        run: cargo rbmt test --toolchain stable --lock-file ${{ matrix.dep }}

  Nightly:                      # 2 jobs, one per lock file.
    name: Test - nightly toolchain
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dep: [minimal, recent]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rbmt
      - name: "Run tests"
        run: cargo rbmt test --toolchain nightly --lock-file ${{ matrix.dep }}

  MSRV:                         # 2 jobs, one per lock file.
    name: Test - 1.74.0 toolchain
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dep: [minimal, recent]
    steps:
      - uses: actions/checkout@v6
      - name: "Free disk space"
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
      - uses: ./.github/actions/setup-rbmt
      - name: "Run tests"
        run: cargo rbmt test --toolchain msrv --lock-file ${{ matrix.dep }}

  Lint:
    name: Lint - nightly toolchain
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dep: [recent]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rbmt
      - name: "Run lint"
        run: cargo rbmt lint

  Docs:
    name: Docs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rbmt
      - name: "Build docs"
        run: cargo rbmt docs

  Bench:
    name: Bench - nightly toolchain
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rbmt
      - name: "Run bench"
        run: RUSTFLAGS="--cfg=bench" cargo rbmt run --toolchain nightly -- bench

  Format:                       #  1 job, run cargo fmt directly.
    name: Format - nightly toolchain
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rbmt
      - name: "Check formatting"
        run: cargo rbmt fmt --check

  Integration:
    name: Integration tests - stable toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rbmt
      - name: Install Elements
        run: |
          curl --fail --location --output elements.tar.gz https://github.com/ElementsProject/elements/releases/download/elements-23.3.1/elements-23.3.1-x86_64-linux-gnu.tar.gz
          echo "864e3a8240137c4e948ecae7c526ccb363771351ea68737a14c682025d5fedaa  elements.tar.gz" | sha256sum --check
          tar -xzf elements.tar.gz
          echo "ELEMENTSD_EXE=$PWD/elements-23.3.1/bin/elementsd" >> "$GITHUB_ENV"
      - name: Run integration tests
        run: cargo test --manifest-path bitcoind-tests/Cargo.toml
