[package]
name = "elements-miniscript"
version = "0.6.0"
authors = ["Andrew Poelstra <apoelstra@wpsoftware.net>, Sanket Kanjalkar <sanket1729@gmail.com>"]
license = "CC0-1.0"
homepage = "https://github.com/ElementsProject/elements-miniscript/"
repository = "https://github.com/ElementsProject/elements-miniscript/"
description = "Miniscript: Elements scripts, descriptors and spending plans"
keywords = [ "crypto", "elements", "miniscript", "script" ]
readme = "README.md"
edition = "2021"
rust-version = "1.74.0"

[features]
default = ["std"]
std = ["bitcoin/std", "bitcoin/secp-recovery", "bech32/std", "serde?/std"]
compiler = []
trace = []

serde = ["dep:serde", "bitcoin/serde", "elements/serde"]
rand = ["bitcoin/rand"]
base64 = ["bitcoin/base64", "elements/base64"]

[dependencies]
bech32 = { version = "0.11.0", default-features = false, features = ["alloc"] }
bitcoin = { version = "0.32.102", default-features = false }
elements = { version = "0.27.0", default-features = false }
hex = { package = "hex-conservative", default-features = false, features = ["alloc"], version = "1.2.0" }

serde = { version = "1.0.195", default-features = false, features = ["alloc"], optional = true }

[dev-dependencies]
serde_test = "1.0.147"
bitcoin = { version = "0.32.102", features = ["base64"] }
secp256k1 = {version = "0.29.0", features = ["rand-std"]}

[[example]]
name = "htlc"
required-features = ["std", "compiler"]

[[example]]
name = "parse"
required-features = ["std"]

[[example]]
name = "sign_multisig"
required-features = ["std"]

[[example]]
name = "verify_tx"
required-features = ["std"]

[[example]]
name = "xpub_descriptors"
required-features = ["std"]

[[example]]
name = "taproot"
required-features = ["compiler","std"]

[[example]]
name = "psbt_sign_finalize"
required-features = ["std", "base64"]

[[example]]
name = "big"
required-features = ["std", "base64", "compiler"]

[[example]]
name = "taptree_of_horror"
path = "examples/taptree_of_horror/taptree_of_horror.rs"
required-features = ["compiler"]

[package.metadata.rbmt.lint]
allowed_duplicates = [
    # rust-elements and rust-bitcoin use different releases of these crates.
    "bitcoin-internals",
    "bitcoin_hashes",
    "hex-conservative",
]

[package.metadata.rbmt.test]
examples = [
    "htlc:std compiler",
    "parse:std",
    "sign_multisig:std",
    "verify_tx:std",
    "xpub_descriptors:std",
    "taproot:std compiler",
    "psbt_sign_finalize:std base64",
    "taptree_of_horror:std compiler",
]
exact_features = [
    ["compiler", "trace"],
    ["compiler", "serde"],
    ["compiler", "rand"],
    ["compiler", "base64"],
    ["trace", "serde"],
    ["trace", "rand"],
    ["trace", "base64"],
    ["serde", "rand"],
    ["serde", "base64"],
    ["rand", "base64"],
    ["compiler", "trace", "serde", "rand", "base64"],
    ["std", "compiler"],
    ["std", "trace"],
    ["std", "serde"],
    ["std", "rand"],
    ["std", "base64"],
    ["std", "compiler", "trace"],
    ["std", "compiler", "serde"],
    ["std", "compiler", "rand"],
    ["std", "compiler", "base64"],
    ["std", "trace", "serde"],
    ["std", "trace", "rand"],
    ["std", "trace", "base64"],
    ["std", "serde", "rand"],
    ["std", "serde", "base64"],
    ["std", "rand", "base64"],
    ["std", "compiler", "trace", "serde", "rand", "base64"],
]

[lints]
workspace = true

[workspace]
members = ["fuzz"]
exclude = ["bitcoind-tests"]

[workspace.metadata.rbmt.toolchains]
nightly = "nightly-2026-10-03"
stable = "1.95.0"

[workspace.lints.clippy]
use_self = "warn"
